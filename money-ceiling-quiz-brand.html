<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Money Ceiling Quiz — Sanjeet Ray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Gistesy';
    src:url('fonts/Gistesy.ttf') format('truetype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --cream:#F9F8F6;
    --linen:#E5DCD5;
    --rose:#E5D2D3;
    --tan:#BEACA2;
    --chocolate:#1B191E;
    --rose-deep:#C9A0A2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--chocolate);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .app{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .frame{
    width:100%;
    max-width:1040px;
    min-height:100vh;
    display:grid;
    grid-template-columns:1fr 1fr;
  }
  .frame.full{ grid-template-columns:1fr; }
  @media (max-width:780px){
    .frame:not(.hero-frame){ grid-template-columns:1fr; }
    .frame:not(.hero-frame) .side{ display:none; }
  }

  .fade{ transition:opacity .22s ease, transform .22s ease; }
  .fade-out{ opacity:0; transform:translateY(6px); }

  .main{
    background:var(--cream);
    padding:44px 48px 56px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .side{
    position:relative;
    background:var(--linen);
    overflow:hidden;
  }
  .side img{
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 22%;
    display:block;
  }
  .side.numeral{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
  }
  .side.numeral .num{
    font-family:'Antic Didone',serif;
    font-size:clamp(90px,14vw,170px);
    color:var(--chocolate);
    opacity:0.85;
    line-height:1;
  }
  .side.numeral .num small{
    font-size:0.32em;
    color:var(--tan);
    display:block;
    margin-top:14px;
    letter-spacing:0.08em;
  }

  .logo-mark{
    height:42px;
    display:block;
    margin-bottom:auto;
  }
  .logo-row{ margin-bottom:40px; }

  .eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--tan);
    margin:0 0 18px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .eyebrow .slash{
    color:var(--rose-deep);
    font-family:'Antic Didone',serif;
    font-size:13px;
  }

  h1{
    font-family:'Antic Didone',serif;
    font-weight:400;
    font-size:clamp(32px,4.6vw,46px);
    line-height:1.14;
    margin:0 0 22px;
    color:var(--chocolate);
  }
  h2{
    font-family:'Antic Didone',serif;
    font-weight:400;
    font-size:clamp(24px,3.4vw,30px);
    line-height:1.32;
    margin:0 0 26px;
    color:var(--chocolate);
  }
  p.lede{
    font-size:16px;
    line-height:1.75;
    color:#4A4640;
    margin:0 0 18px;
    max-width:46ch;
  }
  p.question-hint{
    font-family:'Inter',sans-serif;
    font-style:italic;
    font-weight:400;
    font-size:13px;
    line-height:1.65;
    color:#7A7266;
    margin-top:auto;
    margin-bottom:0;
    max-width:44ch;
  }
  .rule{
    width:64px;
    height:1px;
    background:var(--tan);
    margin:0 0 32px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    text-align:left;
    background:transparent;
    border:1px solid #D9D1C6;
    border-radius:3px;
    padding:16px 20px;
    color:var(--chocolate);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    line-height:1.55;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .option:hover{
    border-color:var(--tan);
    background:rgba(190,172,162,0.10);
  }
  .option:focus-visible{
    outline:2px solid var(--rose-deep);
    outline-offset:2px;
  }
  .option.selected{
    border-color:var(--chocolate);
    background:rgba(27,25,30,0.05);
  }
  .option:disabled{ cursor:default; }

  .actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:36px;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.02em;
    border-radius:3px;
    padding:15px 30px;
    cursor:pointer;
    border:1px solid transparent;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--chocolate);
    color:var(--cream);
    border:none;
  }
  .btn-primary:disabled{
    opacity:0.3;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:#8A8276;
    border:1px solid #D9D1C6;
    padding:15px 22px;
  }
  .btn-ghost:hover{color:var(--chocolate); border-color:var(--tan);}

  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--tan);
    margin-bottom:9px;
  }
  .field input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid #D9D1C6;
    border-radius:0;
    padding:10px 2px;
    color:var(--chocolate);
    font-family:'Inter',sans-serif;
    font-size:16px;
  }
  .field input:focus{
    outline:none;
    border-bottom-color:var(--chocolate);
  }
  .field-error{
    display:none;
    color:#A8493C;
    font-size:13px;
    margin-top:8px;
  }
  .field-error.show{display:block;}

  /* Hero intro — full-bleed Mind Alchemy style */
  .hero-frame{ grid-template-columns:1fr; }
  .hero{
    position:relative;
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
  }
  .hero img.hero-bg{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 32%;
    z-index:0;
  }
  .hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(27,25,30,0.02) 0%, rgba(27,25,30,0.12) 30%, rgba(22,19,16,0.82) 72%, rgba(15,13,12,0.94) 100%);
    z-index:1;
  }
  .hero-content{
    position:relative;
    z-index:2;
    padding:48px 40px 56px;
    max-width:620px;
  }
  .hero-logo{
    height:38px;
    display:block;
    margin-bottom:28px;
  }
  .hero-eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--rose);
    margin:0 0 16px;
  }
  .hero-title{
    font-family:'Antic Didone',serif;
    font-weight:400;
    font-size:clamp(38px,7.5vw,58px);
    line-height:1.1;
    color:var(--cream);
    margin:0 0 18px;
  }
  .hero-sub{
    font-family:'Inter',sans-serif;
    font-size:15.5px;
    line-height:1.7;
    color:#E4DFD8;
    margin:0 0 30px;
    max-width:50ch;
  }

  /* Result screen — dark chocolate takeover */
  .result-wrap{
    background:var(--chocolate);
    min-height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    padding:64px 24px 80px;
  }
  .result-inner{
    max-width:620px;
    width:100%;
  }
  .result-logo{ height:44px; margin-bottom:56px; display:block; }
  .result-badge{
    display:inline-block;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rose);
    border:1px solid rgba(229,210,211,0.35);
    border-radius:999px;
    padding:7px 16px;
    margin-bottom:22px;
  }
  .result-archetype{
    font-family:'Antic Didone',serif;
    font-weight:400;
    font-size:clamp(44px,8vw,64px);
    color:var(--cream);
    line-height:1.05;
    margin:0 0 8px;
  }
  .result-number{
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--tan);
    margin-bottom:36px;
    letter-spacing:0.02em;
  }
  .result-body p{
    font-size:16.5px;
    line-height:1.8;
    color:#E9E4DC;
    margin:0 0 20px;
  }
  .result-body p.italic-block{
    color:var(--rose);
    font-size:15.5px;
    background:rgba(229,210,211,0.06);
    border-radius:4px;
    padding:18px 20px;
    border-left:2px solid var(--rose-deep);
  }
  .result-closing{
    margin-top:16px;
    padding-top:28px;
    border-top:1px solid rgba(229,220,213,0.18);
    font-family:'Gistesy', cursive;
    font-size:26px;
    color:var(--rose);
    line-height:1.5;
  }
  .wa-cta-copy{
    margin-top:28px;
    font-size:15.5px;
    line-height:1.7;
    color:#E4DFD8;
    max-width:50ch;
  }
  .wa-cta{
    display:inline-block;
    margin-top:22px;
    text-decoration:none;
    text-align:center;
    background:var(--cream);
    color:var(--chocolate);
    border:none;
  }
  .restart-link{
    margin-top:34px;
  }
  .restart-link button{
    background:none;
    border:none;
    color:var(--tan);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    padding:0;
  }
  .restart-link button:hover{color:var(--cream);}

  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (prefers-reduced-motion:reduce){
    .fade{ transition:none; }
  }
</style>
</head>

  <div class="frame fade" id="frame"></div>
</div>

      "So the ceiling was never really about ability. It was about a room you haven't turned the lights on in yet, one you've been walking past for a while now.",

      "So the ceiling was never really about earning power. It was about an unfamiliarity with the feeling of money simply staying put, long enough to actually build something.",

let state = { current:-1, answers:{}, name:'', contact:'', email:'' };
const scoredQuestions = QUESTIONS.filter(q=>q.scored);
const frame = document.getElementById('frame');
const AUTO_ADVANCE_DELAY = 380;

function transitionTo(renderFn){
  frame.classList.add('fade-out');
  setTimeout(()=>{
    renderFn();
    frame.classList.remove('fade-out');
  }, 220);
}

function sidePanelImage(src, alt){
  return `<div class="side"><img src="${src}" alt="${alt}"></div>`;
}
function sidePanelNumeral(step,total){
  return `<div class="side numeral"><div class="num">${String(step).padStart(2,'0')}<small>of ${total}</small></div></div>`;
}

function renderIntro(){
  frame.className = 'frame fade hero-frame';
  frame.innerHTML = `
    <div class="hero">
      <img class="hero-bg" src="${HERO_BG}" alt="Sanjeet Ray">
      <div class="hero-scrim"></div>
      <div class="hero-content">
        <img class="hero-logo" src="${LOGO_CREAM}" alt="Sanjeet Ray">
        <p class="hero-eyebrow">The Money Ceiling Quiz</p>
        <h1 class="hero-title">What's the pattern keeping you stuck at your number?</h1>
        <p class="hero-sub">This quiz helps you identify your Money Ceiling, the number you keep circling back to but haven't been able to cross, and more importantly, the pattern that's quietly keeping you there.</p>
        <button class="btn btn-primary" id="startBtn">Start the quiz</button>
      </div>
    </div>
  `;
  document.getElementById('startBtn').onclick = ()=>{ state.current = 0; transitionTo(renderQuestion); };
}

function renderQuestion(){
  frame.className = 'frame fade';
  const q = QUESTIONS[state.current];
  const selected = state.answers[q.id];
  const step = state.current+1;
  frame.innerHTML = `
    <div class="main">
      <div class="logo-row"><img class="logo-mark" src="${LOGO_DARK}" alt="Sanjeet Ray"></div>
      <p class="eyebrow"><span class="slash">/</span> Question ${step} of ${QUESTIONS.length}</p>
      <h2>${q.prompt}</h2>
      <div class="options" id="optionsWrap"></div>
      <div class="actions">
        ${step>1 ? '<button class="btn btn-ghost" id="backBtn">Back</button>' : '<span></span>'}
        <span></span>
      </div>
      <p class="question-hint">Choose the answer that feels closest to your truth. Don’t overthink it.</p>
    </div>
    ${sidePanelNumeral(step, QUESTIONS.length)}
  `;
  const wrap = document.getElementById('optionsWrap');
  q.options.forEach((opt)=>{
    const b = document.createElement('button');
    b.className = 'option' + (selected===opt.value ? ' selected':'');
    b.textContent = opt.text;
    b.setAttribute('aria-pressed', selected===opt.value ? 'true':'false');
    b.onclick = ()=>{
      if(b.disabled) return;
      state.answers[q.id] = opt.value;
      Array.from(wrap.children).forEach(c=>{ c.disabled = true; });
      wrap.querySelectorAll('.option').forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
      setTimeout(()=>{
        if(state.current < QUESTIONS.length-1){
          state.current++;
          transitionTo(renderQuestion);
        } else {
          transitionTo(renderCapture);
        }
      }, AUTO_ADVANCE_DELAY);
    };
    wrap.appendChild(b);
  });
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.onclick = ()=>{ state.current--; transitionTo(renderQuestion); };
}

function renderCapture(){
  frame.className = 'frame fade';
  frame.innerHTML = `
    <div class="main">
      <div class="logo-row"><img class="logo-mark" src="${LOGO_DARK}" alt="Sanjeet Ray"></div>
      <p class="eyebrow"><span class="slash">/</span> Last step</p>
      <h2>Where should we send your full result?</h2>
      <p class="lede">Your result appears right here in a moment. We'll also send the full breakdown and what to do next on WhatsApp.</p>
      <div class="field">
        <label for="fname">Name</label>
        <input type="text" id="fname" placeholder="Your name">
      </div>
      <div class="field">
        <label for="wa">WhatsApp number</label>
        <input type="tel" id="wa" placeholder="e.g. 98200 00000" inputmode="numeric">
        <div class="field-error" id="waError">Enter your name and WhatsApp number to see your result.</div>
      </div>
      <div class="field">
        <label for="email">Email (optional backup)</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="backBtn">Back</button>
        <button class="btn btn-primary" id="revealBtn">Reveal my result</button>
      </div>
    </div>
    ${sidePanelImage(PORTRAIT_CAPTURE,'Sanjeet Ray')}
  `;
  document.getElementById('backBtn').onclick = ()=>{ state.current = QUESTIONS.length-1; transitionTo(renderQuestion); };
  document.getElementById('revealBtn').onclick = ()=>{
    const name = document.getElementById('fname').value.trim();
    const wa = document.getElementById('wa').value.trim();
    const email = document.getElementById('email').value.trim();
    const err = document.getElementById('waError');
    const digits = wa.replace(/\D/g,'');
    if(!name || digits.length < 8){
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    state.name = name;
    state.contact = wa;
    state.email = email;
    const archetype = computeArchetype();
    fetch(QUIZ_CONFIG.API_BASE + '/quiz/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        phone: wa,
        email: email || null,
        archetype,
        answers: state.answers
      })
    }).catch(()=>{});
    transitionTo(renderResult);
  };
  ['fname','wa'].forEach(id=>{
    document.getElementById(id).oninput = ()=>{
      document.getElementById('waError').classList.remove('show');
    };
  });
}

function computeArchetype(){
  const tally = {};
  scoredQuestions.forEach(q=>{
    const v = state.answers[q.id];
    tally[v] = (tally[v]||0) + 1;
  });
  let max = Math.max(...Object.values(tally));
  let tied = Object.keys(tally).filter(k=>tally[k]===max);
  if(tied.length === 1) return tied[0];

  const q7 = state.answers['q7'];
  if(tied.includes(q7)) return q7;

  const q5 = state.answers['q5'];
  if(tied.includes(q5)) return q5;

  return tied[0];
}

function renderResult(){
  frame.className = 'frame fade full';
  const archetype = computeArchetype();
  const income = state.answers['q2'];
  const profession = state.answers['q1'];
  const result = RESULTS[archetype];
  const branch = PROFESSION_BRANCHES[archetype][profession];

  const introText = result.intro.replaceAll('{X}', income);
  const bodyParas = result.body.map(p=>p.replaceAll('{X}', income));

  frame.innerHTML = `
    <div class="result-wrap">
      <div class="result-inner">
        <img class="result-logo" src="${LOGO_CREAM}" alt="Sanjeet Ray">
        <div class="result-badge">Your money archetype</div>
        <div class="result-archetype">${archetype}</div>
        <div class="result-number">${state.name}, circling ${income}</div>
        <div class="result-body">
          <p>${introText}</p>
          <p class="italic-block">${branch}</p>
          ${bodyParas.map(p=>`<p>${p}</p>`).join('')}
        </div>
        <div class="result-closing">This is the pattern. The masterclass is where we get into why it's there, and what actually moves it.</div>
        <p class="wa-cta-copy">I am actually doing a masterclass, which will help you go deeper into the specific art style. Click on the button below to get the link for the same and Sanjeet will personally make sure that you get the link.</p>
        <a class="btn wa-cta" id="waCta" target="_blank" rel="noopener">Get the masterclass link</a>
        <div class="restart-link">
          <button id="restartBtn">Take the quiz again</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('restartBtn').onclick = ()=>{
    state = { current:-1, answers:{}, name:'', contact:'', email:'' };
    transitionTo(renderIntro);
  };
  const waCta = document.getElementById('waCta');
  if(waCta){
    waCta.href = 'https://wa.me/' + QUIZ_CONFIG.WHATSAPP_NUMBER + '?text=' + encodeURIComponent(QUIZ_CONFIG.PREFILL_TEXT);
  }
}

renderIntro();
</script>
